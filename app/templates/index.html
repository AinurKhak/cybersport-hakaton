<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EAI CS2</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<header class="header">
    <div class="header-inner">

        <div class="brand">
            <div class="brand-icon">EAI</div>

            <div>
                <h1>EAI CS2</h1>
                <p>Esports AI Image Analysis</p>
            </div>
        </div>

        <div class="header-status">
            <span class="status-dot"></span>
            ImageScope
        </div>

    </div>
</header>


<main class="container">

    <!-- Панель запуска -->
    <section class="control-panel">

        <div class="panel-head">

            <div>
                <span class="eyebrow">SOURCE</span>
                <h2>CS2 Teams</h2>
            </div>

            <a
                class="source-link"
                href="https://www.cybersport.ru/teams/cs2"
                target="_blank"
            >
                Cybersport.ru ↗
            </a>

        </div>


        <div class="controls">

            <div class="control">
                <label for="filter">Обработка</label>

                <select id="filter">
                    <option value="grayscale">
                        Grayscale + Sharpen
                    </option>

                    <option value="invert">
                        Invert + Sharpen
                    </option>
                </select>
            </div>


            <div class="control small-control">
                <label for="maxImages">
                    Изображения
                </label>

                <input
                    id="maxImages"
                    type="number"
                    min="1"
                    max="100"
                    value="100"
                >
            </div>


            <button id="analyzeButton">
                <span>Запустить анализ</span>
                <span class="button-arrow">→</span>
            </button>

        </div>


        <div id="status" class="status">
            <span class="status-indicator"></span>
            Готово к запуску
        </div>

    </section>


    <!-- Общая статистика -->
    <section id="summary" class="summary hidden">

        <div class="summary-card">
            <span>Обработано</span>
            <strong id="totalSuccessful">0</strong>
        </div>

        <div class="summary-card">
            <span>Фильтр</span>
            <strong id="usedFilter">—</strong>
        </div>

        <div class="summary-card">
            <span>Ошибки</span>
            <strong id="errorsCount">0</strong>
        </div>

    </section>


    <!-- Результаты -->
    <section class="results-section">

        <div class="section-title">
            <div>
                <span class="eyebrow">ANALYSIS</span>
                <h2>Результаты</h2>
            </div>
        </div>

        <section id="results" class="results"></section>

    </section>


    <!-- Ошибки -->
    <section id="errorsSection" class="errors-section hidden">

        <div class="section-title">
            <span class="eyebrow error-label">ERROR LOG</span>
            <h2>Ошибки обработки</h2>
        </div>

        <div id="errors"></div>

    </section>

</main>


<footer>
    EAI CS2 · ImageScope Hackathon
</footer>


<script src="/static/script.js"></script>

</body>
</html>
